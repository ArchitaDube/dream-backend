[tool.poetry]
name = "oneiros-api"
version = "0.1.0"
description = "Oneiros dream journaling API"
authors = ["Oneiros"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.115.0"
uvicorn = {version = "0.30.0", extras = ["standard"]}
openai = ">=1.55.0"
sqlalchemy = "^2.0.36"
asyncpg = "0.29.0"
alembic = "^1.13.0"
upstash-redis = "1.1.0"
boto3 = "1.35.0"
cryptography = "43.0.0"
mnemonic = "0.21"
pydantic-settings = "2.5.0"
python-nanoid = "2.0.0"
stripe = "10.0.0"
httpx = "0.28.1"
psycopg2-binary = "^2.9.12"
greenlet = "^3.5.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-httpx = "^0.36.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
